[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtc-contracts"
version = "0.1.0"
description = "Versioned data contracts for the MTC research and execution boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "MTC Command Center"}]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
build = ["build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mtc_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
