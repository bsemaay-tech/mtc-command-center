# /etc/ssh/sshd_config.d/70-mtc-watch.conf — FROZEN V3. root:root 0644.
# Layer 1 of two: server-level lockdown for the watcher account. Layer 2 is the
# root-owned authorized_keys command=...,restrict entry.
Match User mtc-watch
    ForceCommand /usr/local/bin/mtc-watch-collect
    DisableForwarding yes
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/mtc-watch
    AllowAgentForwarding no
    X11Forwarding no
